name: realtime_crypto

services:
  notifier:
    build:
      context: ./services/notifier
      dockerfile: Dockerfile.bot
    container_name: notifier
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./services/notifier:/app
      - ./utils:/app/utils
    networks:
      - net

include:
  - ./deployment/docker-compose.kafka.yml
  - ./deployment/docker-compose.spark.yml
  - ./deployment/docker-compose.postgre.yml
  - ./deployment/docker-compose.redis.yml

networks:
  net:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  redis-data: