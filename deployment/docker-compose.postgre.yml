services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: whale_alert
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../utils/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - net